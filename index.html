<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="wrapper">
    <div id="box">
        <h1 id="title">Splash Zone Tickets</h1>
        <p>Enter your name and age to see your ticket price</p>
        <div id="form">
            <div>
                <p>Name:</p>
                <input type="text" id="name" placeholder="Enter your name">
            </div>
            <div>
                <p>Age:</p>
                <input type="number" id="age" placeholder="Enter your age">
            </div>
            <button id="submit">Get My Ticket</button>
        </div>
        <div id="response"></div>
    </div>
</div>

<link rel="stylesheet" href="style.css">
<script src="app.js"></script>
</body>
</html>
